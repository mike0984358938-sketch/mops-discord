name: MOPS → Discord

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: mops-discord
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: mops-state-${{ github.run_id }}
          restore-keys: mops-state-

      - name: Check MOPS and post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_NEWS: ${{ secrets.DISCORD_WEBHOOK_NEWS }}
          DISCORD_WEBHOOK_SELFREPORT: ${{ secrets.DISCORD_WEBHOOK_SELFREPORT }}
          DISCORD_WEBHOOK_REVENUE: ${{ secrets.DISCORD_WEBHOOK_REVENUE }}
          DISCORD_WEBHOOK_FINANCIAL: ${{ secrets.DISCORD_WEBHOOK_FINANCIAL }}
        run: python mops_discord.py

      - name: Save state
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: mops-state-${{ github.run_id }}
